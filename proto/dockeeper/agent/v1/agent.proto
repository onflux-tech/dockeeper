syntax = "proto3";

package dockeeper.agent.v1;

option go_package = "github.com/onflux-tech/dockeeper/proto/gen/dockeeper/agent/v1;agentpb";

import "google/protobuf/timestamp.proto";

// ── Enrollment ──────────────────────────────────────

service AgentEnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);
}

message ServerInfo {
  string hostname = 1;
  string ip_address = 2;
  string os = 3;
  string arch = 4;
  string docker_version = 5;
  string agent_version = 6;
  string orchestrator = 7; // docker, podman, kubernetes
}

message EnrollRequest {
  string token = 1;
  ServerInfo info = 2;
}

message EnrollResponse {
  string server_id = 1;
  bytes ca_cert = 2;
  bytes client_cert = 3;
  bytes client_key = 4;
  google.protobuf.Timestamp cert_expires_at = 5;
}

message RenewCertRequest {
  string server_id = 1;
}

message RenewCertResponse {
  bytes client_cert = 1;
  bytes client_key = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// ── Metrics ─────────────────────────────────────────

service AgentMetricsService {
  rpc StreamMetrics(stream StreamMetricsRequest) returns (StreamMetricsResponse);
  rpc StreamContainerMetrics(stream StreamContainerMetricsRequest) returns (StreamContainerMetricsResponse);
}

message StreamMetricsRequest {
  string server_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  double cpu_percent = 3;
  double mem_percent = 4;
  uint64 mem_used = 5;
  uint64 mem_total = 6;
  uint64 disk_used = 7;
  uint64 disk_total = 8;
  uint64 net_rx = 9;
  uint64 net_tx = 10;
  double load_1m = 11;
  double load_5m = 12;
  double load_15m = 13;
}

message StreamMetricsResponse {
  int32 received_count = 1;
}

message StreamContainerMetricsRequest {
  string server_id = 1;
  string container_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  double cpu_percent = 4;
  uint64 mem_used = 5;
  uint64 mem_limit = 6;
  uint64 net_rx = 7;
  uint64 net_tx = 8;
  uint64 block_read = 9;
  uint64 block_write = 10;
  uint32 pids = 11;
}

message StreamContainerMetricsResponse {
  int32 received_count = 1;
}

// ── Discovery ───────────────────────────────────────

service AgentDiscoveryService {
  rpc ReportContainers(ReportContainersRequest) returns (ReportContainersResponse);
  rpc ReportImages(ReportImagesRequest) returns (ReportImagesResponse);
  rpc ReportNetworks(ReportNetworksRequest) returns (ReportNetworksResponse);
  rpc ReportVolumes(ReportVolumesRequest) returns (ReportVolumesResponse);
}

message ResourceLimits {
  double cpu_limit = 1;
  uint64 mem_limit = 2;
  uint32 pids_limit = 3;
}

message ContainerInfo {
  string container_id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  string ports_json = 5;
  string labels_json = 6;
  string volumes_json = 7;
  string networks_json = 8;
  ResourceLimits resource_limits = 9;
  string restart_policy = 10;
  string command = 11;
  string entrypoint = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp started_at = 14;
}

message ReportContainersRequest {
  string server_id = 1;
  repeated ContainerInfo containers = 2;
}

message ReportContainersResponse {
  int32 received_count = 1;
}

message ImageInfo {
  string image_id = 1;
  repeated string tags = 2;
  uint64 size = 3;
  google.protobuf.Timestamp created_at = 4;
  bool in_use = 5;
}

message ReportImagesRequest {
  string server_id = 1;
  repeated ImageInfo images = 2;
}

message ReportImagesResponse {
  int32 received_count = 1;
}

message NetworkInfo {
  string network_id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;
  string subnet = 5;
  string gateway = 6;
  bool internal = 7;
  string labels_json = 8;
}

message ReportNetworksRequest {
  string server_id = 1;
  repeated NetworkInfo networks = 2;
}

message ReportNetworksResponse {
  int32 received_count = 1;
}

message VolumeInfo {
  string name = 1;
  string driver = 2;
  string mountpoint = 3;
  uint64 size = 4;
  string labels_json = 5;
  bool in_use = 6;
}

message ReportVolumesRequest {
  string server_id = 1;
  repeated VolumeInfo volumes = 2;
}

message ReportVolumesResponse {
  int32 received_count = 1;
}

// ── Commands ────────────────────────────────────────

service AgentCommandsService {
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_START = 1;
  COMMAND_TYPE_STOP = 2;
  COMMAND_TYPE_RESTART = 3;
  COMMAND_TYPE_PAUSE = 4;
  COMMAND_TYPE_UNPAUSE = 5;
  COMMAND_TYPE_REMOVE = 6;
  COMMAND_TYPE_PULL_IMAGE = 7;
  COMMAND_TYPE_CREATE = 8;
  COMMAND_TYPE_UPDATE_RESOURCES = 9;
  COMMAND_TYPE_RECREATE_ENV = 10;
  COMMAND_TYPE_UPDATE_IMAGE = 11;
  COMMAND_TYPE_UNINSTALL = 12;
}

message ExecuteCommandRequest {
  string server_id = 1;
  string container_id = 2;
  CommandType type = 3;
  map<string, string> params = 4;
}

message ExecuteCommandResponse {
  bool success = 1;
  string error = 2;
  string output = 3;
}

// ── Exec ────────────────────────────────────────────

service AgentExecService {
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
}

message ExecStart {
  string container_id = 1;
  repeated string command = 2;
  bool tty = 3;
}

message ExecResize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecRequest {
  oneof input {
    ExecStart start = 1;
    bytes stdin_data = 2;
    ExecResize resize = 3;
  }
}

message ExecResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  optional int32 exit_code = 3;
}

// ── Logs ────────────────────────────────────────────

service AgentLogsService {
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
}

message StreamLogsRequest {
  string container_id = 1;
  string since = 2;
  uint32 tail_lines = 3;
  bool follow = 4;
}

message StreamLogsResponse {
  google.protobuf.Timestamp timestamp = 1;
  string stream = 2; // stdout, stderr
  string message = 3;
}

// ── Images ───────────────────────────────────────────

service AgentImageService {
  rpc PullImage(ImagePullRequest) returns (stream ImagePullProgress);
  rpc RemoveImage(ImageRemoveRequest) returns (ImageRemoveResponse);
  rpc PruneImages(ImagePruneRequest) returns (ImagePruneResponse);
}

message ImagePullRequest {
  string image_ref = 1;
}

message ImagePullProgress {
  string id = 1;        // layer ID
  string status = 2;    // Pulling, Downloading, Extracting, etc.
  int64 current = 3;    // bytes downloaded/extracted so far
  int64 total = 4;      // total bytes for this layer
  bool done = 5;        // final message
  string error = 6;     // non-empty on failure
}

message ImageRemoveRequest {
  string image_id = 1;
  bool force = 2;
  bool prune_children = 3;
}

message ImageRemoveResponse {
  bool success = 1;
  string error = 2;
  repeated string deleted = 3;
  repeated string untagged = 4;
}

message ImagePruneRequest {
  bool all = 1;
}

message ImagePruneResponse {
  bool success = 1;
  string error = 2;
  repeated string deleted = 3;
  uint64 space_reclaimed = 4;
}

// ── Compose ──────────────────────────────────────────

service AgentComposeService {
  rpc ComposeUp(ComposeRequest) returns (stream ComposeOutput);
  rpc ComposeDown(ComposeRequest) returns (stream ComposeOutput);
  rpc ComposePull(ComposeRequest) returns (stream ComposeOutput);
  rpc ComposeConfig(ComposeConfigRequest) returns (ComposeConfigResponse);
}

message ComposeRequest {
  string project_name = 1;
  string working_dir = 2;
  repeated string files = 3;
}

message ComposeOutput {
  string line = 1;
  string stream = 2;   // "stdout" or "stderr"
  bool done = 3;
  int32 exit_code = 4;
  string error = 5;
}

message ComposeConfigRequest {
  string project_name = 1;
  string working_dir = 2;
  repeated string files = 3;
}

message ComposeConfigResponse {
  string yaml_content = 1;
}

// ── Networks ─────────────────────────────────────────

service AgentNetworkService {
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse);
  rpc RemoveNetwork(RemoveNetworkRequest) returns (RemoveNetworkResponse);
  rpc ConnectContainer(NetworkConnectRequest) returns (NetworkConnectResponse);
  rpc DisconnectContainer(NetworkDisconnectRequest) returns (NetworkDisconnectResponse);
}

message CreateNetworkRequest {
  string name = 1;
  string driver = 2;      // bridge, overlay, macvlan, etc.
  string subnet = 3;      // e.g. "172.20.0.0/16"
  string gateway = 4;     // e.g. "172.20.0.1"
  bool internal = 5;
  map<string, string> labels = 6;
}

message CreateNetworkResponse {
  string network_id = 1;
  bool success = 2;
  string error = 3;
}

message RemoveNetworkRequest {
  string network_id = 1;
}

message RemoveNetworkResponse {
  bool success = 1;
  string error = 2;
}

message NetworkConnectRequest {
  string network_id = 1;
  string container_id = 2;
}

message NetworkConnectResponse {
  bool success = 1;
  string error = 2;
}

message NetworkDisconnectRequest {
  string network_id = 1;
  string container_id = 2;
  bool force = 3;
}

message NetworkDisconnectResponse {
  bool success = 1;
  string error = 2;
}

// ── Volumes ──────────────────────────────────────────

service AgentVolumeService {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);
  rpc InspectVolume(InspectVolumeRequest) returns (InspectVolumeResponse);
}

message CreateVolumeRequest {
  string name = 1;
  string driver = 2;
  map<string, string> labels = 3;
}

message CreateVolumeResponse {
  string name = 1;
  bool success = 2;
  string error = 3;
}

message RemoveVolumeRequest {
  string name = 1;
  bool force = 2;
}

message RemoveVolumeResponse {
  bool success = 1;
  string error = 2;
}

message InspectVolumeRequest {
  string name = 1;
}

message InspectVolumeResponse {
  string name = 1;
  string driver = 2;
  string mountpoint = 3;
  int64 size_bytes = 4;
  map<string, string> labels = 5;
  string created_at = 6;
  bool success = 7;
  string error = 8;
}

// ── Backups ──────────────────────────────────────────

service AgentBackupService {
  rpc BackupVolume(BackupVolumeRequest) returns (stream BackupProgress);
  rpc RestoreVolume(RestoreVolumeRequest) returns (stream BackupProgress);
}

message S3Config {
  string endpoint = 1;
  string bucket = 2;
  string key = 3;         // object key (path in bucket)
  string access_key = 4;
  string secret_key = 5;
  string region = 6;
  bool use_ssl = 7;
}

message BackupVolumeRequest {
  string volume_name = 1;
  string mountpoint = 2;
  S3Config s3 = 3;
}

message RestoreVolumeRequest {
  string volume_name = 1;
  string mountpoint = 2;
  S3Config s3 = 3;
}

message BackupProgress {
  string status = 1;         // starting, tarring, uploading, downloading, extracting, done
  string message = 2;
  int64 bytes_processed = 3;
  int64 total_bytes = 4;
  bool done = 5;
  string error = 6;
}

// ── Traefik ──────────────────────────────────────────

service AgentTraefikService {
  rpc ReportTraefikRoutes(ReportTraefikRoutesRequest) returns (ReportTraefikRoutesResponse);
}

message TraefikRouteInfo {
  string name = 1;
  string rule = 2;
  string service = 3;
  repeated string entrypoints = 4;
  bool tls = 5;
  repeated string middlewares = 6;
  string provider = 7;
  string status = 8;
}

message ReportTraefikRoutesRequest {
  string server_id = 1;
  repeated TraefikRouteInfo routes = 2;
}

message ReportTraefikRoutesResponse {
  int32 received_count = 1;
}

// ── Updates ──────────────────────────────────────────

service AgentUpdateService {
  rpc CheckImageDigest(CheckImageDigestRequest) returns (CheckImageDigestResponse);
  rpc ExecuteContainerUpdate(ExecuteContainerUpdateRequest) returns (stream ContainerUpdateProgress);
  rpc UpdateAgentBinary(stream UpdateBinaryChunk) returns (UpdateBinaryResponse);
}

message CheckImageDigestRequest {
  string image_ref = 1;
  string registry_auth = 2; // base64-encoded JSON auth config
}

message CheckImageDigestResponse {
  string current_digest = 1;
  string remote_digest = 2;
  bool update_available = 3;
}

message ExecuteContainerUpdateRequest {
  string container_id = 1;
  string new_image = 2;
  string registry_auth = 3;
  bool backup_before = 4;
}

message ContainerUpdateProgress {
  string step = 1;     // pulling, stopping, creating, starting, verifying, done, failed, rolledback
  string message = 2;
  float progress = 3;  // 0.0-1.0 for pull progress
}

// ── Agent Binary Update ─────────────────────────────────

message UpdateBinaryChunk {
  bytes chunk = 1;
  string checksum = 2;     // SHA256, sent in last chunk
  string version = 3;      // Target version
  bool is_last_chunk = 4;
}

message UpdateBinaryResponse {
  bool success = 1;
  string error = 2;
  string current_version = 3;
}

// ── Health Checks ────────────────────────────────────────

service AgentHealthService {
  rpc ExecuteHealthCheck(ExecuteHealthCheckRequest) returns (ExecuteHealthCheckResponse);
}

message ExecuteHealthCheckRequest {
  string container_id = 1;   // Docker container ID to resolve IP
  string url_path = 2;       // HTTP path e.g. "/health"
  int32 port = 3;            // Container port
  int32 timeout_ms = 4;
  int32 expected_status = 5; // e.g. 200
}

message ExecuteHealthCheckResponse {
  int32 status_code = 1;
  int64 response_time_ms = 2;
  string error = 3;
  bool success = 4;
}

// ══════════════════════════════════════════════════════
// Reverse Tunnel — Agent→Manager channels (zero inbound ports)
// ══════════════════════════════════════════════════════

// ── Command Channel (persistent control plane) ──────

// Persistent bidirectional stream for command dispatch.
// Agent connects on startup and keeps the stream alive.
// Manager sends commands, agent sends results. Multiplexed by request_id.
service AgentCommandChannelService {
  rpc OpenChannel(stream OpenChannelRequest) returns (stream OpenChannelResponse);
}

// Agent → Manager messages on the command channel.
message OpenChannelRequest {
  oneof payload {
    ChannelInit init = 1;
    ChannelHeartbeat heartbeat = 2;
    ChannelCommandResult command_result = 3;
  }
}

// Manager → Agent messages on the command channel.
message OpenChannelResponse {
  oneof payload {
    ChannelHeartbeat heartbeat = 1;
    ChannelCommand command = 2;
    OpenDataStreamSignal open_data_stream = 3;
    OpenExecStreamSignal open_exec_stream = 4;
  }
}

// First message the agent sends to identify itself.
message ChannelInit {
  string server_id = 1;
}

// Keepalive ping/pong (15s interval).
message ChannelHeartbeat {
  int64 timestamp_ms = 1;
}

// Manager dispatches a command to the agent. Uses request_id for multiplexing.
message ChannelCommand {
  string request_id = 1;

  // Priority: 0 = CRITICAL (exec), 1 = HIGH (container ops), 2 = NORMAL (data), 3 = LOW (health)
  int32 priority = 2;

  oneof command {
    // Container commands
    ExecuteCommandRequest execute_command = 10;

    // Image commands (unary)
    ImageRemoveRequest remove_image = 20;
    ImagePruneRequest prune_images = 21;

    // Compose (unary — config only)
    ComposeConfigRequest compose_config = 30;

    // Network commands
    CreateNetworkRequest create_network = 40;
    RemoveNetworkRequest remove_network = 41;
    NetworkConnectRequest connect_container = 42;
    NetworkDisconnectRequest disconnect_container = 43;

    // Volume commands
    CreateVolumeRequest create_volume = 50;
    RemoveVolumeRequest remove_volume = 51;
    InspectVolumeRequest inspect_volume = 52;

    // Health check
    ExecuteHealthCheckRequest health_check = 60;

    // Update check (unary)
    CheckImageDigestRequest check_image_digest = 70;
  }
}

// Agent sends the result of a command back to the manager.
message ChannelCommandResult {
  string request_id = 1;

  oneof result {
    ExecuteCommandResponse execute_command = 10;
    ImageRemoveResponse remove_image = 20;
    ImagePruneResponse prune_images = 21;
    ComposeConfigResponse compose_config = 30;
    CreateNetworkResponse create_network = 40;
    RemoveNetworkResponse remove_network = 41;
    NetworkConnectResponse connect_container = 42;
    NetworkDisconnectResponse disconnect_container = 43;
    CreateVolumeResponse create_volume = 50;
    RemoveVolumeResponse remove_volume = 51;
    InspectVolumeResponse inspect_volume = 52;
    ExecuteHealthCheckResponse health_check = 60;
    CheckImageDigestResponse check_image_digest = 70;
    ChannelCommandError error = 99;
  }
}

// Generic error for when command execution fails.
message ChannelCommandError {
  int32 code = 1;
  string message = 2;
}

// Signal the agent to open a DataStream for a streaming operation.
message OpenDataStreamSignal {
  string stream_id = 1;
  DataStreamType stream_type = 2;

  oneof params {
    StreamLogsRequest stream_logs = 10;
    ImagePullRequest pull_image = 11;
    ComposeRequest compose_up = 12;
    ComposeRequest compose_down = 13;
    ComposeRequest compose_pull = 14;
    BackupVolumeRequest backup_volume = 15;
    RestoreVolumeRequest restore_volume = 16;
    ExecuteContainerUpdateRequest container_update = 17;
    DataStreamUpdateBinaryParams update_binary = 18;
  }
}

enum DataStreamType {
  DATA_STREAM_TYPE_UNSPECIFIED = 0;
  DATA_STREAM_TYPE_LOGS = 1;
  DATA_STREAM_TYPE_IMAGE_PULL = 2;
  DATA_STREAM_TYPE_COMPOSE_UP = 3;
  DATA_STREAM_TYPE_COMPOSE_DOWN = 4;
  DATA_STREAM_TYPE_COMPOSE_PULL = 5;
  DATA_STREAM_TYPE_BACKUP = 6;
  DATA_STREAM_TYPE_RESTORE = 7;
  DATA_STREAM_TYPE_CONTAINER_UPDATE = 8;
  DATA_STREAM_TYPE_AGENT_UPDATE = 9;
}

// Parameters for agent binary update via DataStream.
message DataStreamUpdateBinaryParams {
  string version = 1;
  string checksum = 2; // Expected SHA256
}

// Signal the agent to open an ExecStream for a terminal session.
message OpenExecStreamSignal {
  string session_id = 1;
  string container_id = 2;
  repeated string command = 3;
  bool tty = 4;
}

// ── Data Stream (on-demand streaming) ────────────────

// On-demand streaming for logs, image pull, compose, backup, and updates.
// Agent opens a DataStream when instructed via OpenDataStreamSignal.
service AgentDataStreamService {
  rpc OpenDataStream(stream OpenDataStreamRequest) returns (stream OpenDataStreamResponse);
}

// Agent → Manager data (logs lines, progress, binary chunks).
message OpenDataStreamRequest {
  string stream_id = 1;

  oneof payload {
    bytes data = 2;                          // Raw binary (update chunks)
    DataStreamText text = 3;                 // Text line (logs, compose output)
    DataStreamProgress progress = 4;         // Progress update (pull, backup)
    DataStreamComplete complete = 5;         // Stream finished
    DataStreamError error = 6;               // Stream errored
  }
}

// Manager → Agent control on a data stream.
message OpenDataStreamResponse {
  string stream_id = 1;

  oneof payload {
    DataStreamCancel cancel = 2;             // Manager requests cancellation
    bytes data = 3;                          // Raw binary (agent update chunks)
  }
}

// Text payload for log lines, compose output, etc.
message DataStreamText {
  string line = 1;
  string stream = 2; // "stdout", "stderr"
}

// Progress payload for image pull, backup, etc.
message DataStreamProgress {
  string status = 1;
  string message = 2;
  string id = 3;             // Layer ID for image pull
  int64 current = 4;
  int64 total = 5;
}

// Signal that the data stream completed successfully.
message DataStreamComplete {
  string summary = 1;
  int32 exit_code = 2;       // For compose operations
}

// Signal that the data stream errored.
message DataStreamError {
  int32 code = 1;
  string message = 2;
}

// Manager requests the agent to cancel the data stream.
message DataStreamCancel {
  string reason = 1;
}

// ── Exec Stream (per-session terminal) ───────────────

// Per-session bidirectional terminal I/O.
// Agent opens when instructed via OpenExecStreamSignal.
// Supports detach/reattach on agent reconnect (session_id matching).
service AgentExecStreamService {
  rpc OpenExecStream(stream OpenExecStreamRequest) returns (stream OpenExecStreamResponse);
}

// Agent → Manager (terminal stdout, exit).
message OpenExecStreamRequest {
  string session_id = 1;

  oneof payload {
    bytes stdout = 2;
    ExecStreamExit exit = 3;
  }
}

// Manager → Agent (terminal stdin, resize, close).
message OpenExecStreamResponse {
  string session_id = 1;

  oneof payload {
    bytes stdin = 2;
    ExecStreamResize resize = 3;
    ExecStreamClose close = 4;
  }
}

// Terminal window resize.
message ExecStreamResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Request to close the exec session.
message ExecStreamClose {}

// Agent reports exec process exited.
message ExecStreamExit {
  int32 exit_code = 1;
}
