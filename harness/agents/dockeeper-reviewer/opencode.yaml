    effect: deny
  - action: shell
    resource: "git apply*"
    effect: deny
  - action: shell
    resource: "git am*"
    effect: deny
  - action: shell
    resource: "git rebase*"
    effect: deny
  - action: shell
    resource: "git merge *"
    effect: deny
  - action: shell
    resource: "git cherry-pick*"
    effect: deny
  - action: shell
