description: "QA read-only de UI/UX do frontend web: valida layout, densidade, paginação, responsividade, estados, a11y e o fluxo principal contra a UI renderizada. Não edita; reporta defeitos com evidência."
mode: subagent
permissions:
  - action: "*"
    resource: "*"
    effect: deny
  - action: read
    resource: "*"
    effect: allow
  - action: glob
    resource: "*"
    effect: allow
  - action: grep
    resource: "*"
    effect: allow
  - action: skill
    resource: "*"
    effect: allow
  - action: shell
    resource: "*"
    effect: allow
