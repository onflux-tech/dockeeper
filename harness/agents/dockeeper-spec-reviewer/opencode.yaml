description: "Review read-only de spec e plano antes da implementação: contratos, enum, capability, migration, integridade e prontidão. Não edita; reporta achados e veredito."
mode: subagent
permissions:
  - action: "*"
    resource: "*"
    effect: deny
  - action: read
    resource: "*"
    effect: allow
  - action: glob
    resource: "*"
    effect: allow
  - action: grep
    resource: "*"
    effect: allow
  - action: skill
    resource: "*"
    effect: allow
  - action: shell
    resource: "*"
    effect: allow
