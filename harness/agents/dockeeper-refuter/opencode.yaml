description: "Refutação adversarial dos achados do dockeeper-reviewer: tenta derrubar cada achado e o veredito GO com evidência. Read-only; reporta UPHELD, REFUTED ou INCONCLUSIVO."
mode: subagent
permissions:
  - action: "*"
    resource: "*"
    effect: deny
  - action: read
    resource: "*"
    effect: allow
  - action: glob
    resource: "*"
    effect: allow
  - action: grep
    resource: "*"
    effect: allow
  - action: skill
    resource: "*"
    effect: allow
  - action: shell
    resource: "*"
    effect: allow
