changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot
      - github-actions

  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix
    - title: "⚡ Improvements"
      labels:
        - improvement
        - performance
        - refactor
    - title: "📦 Infrastructure & CI"
      labels:
        - ci
        - infrastructure
        - docker
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "🔒 Security"
      labels:
        - security
    - title: "🔧 Other Changes"
      labels:
        - "*"
