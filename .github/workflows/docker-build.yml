name: Docker Build

on:
  workflow_call:
    inputs:
      version:
        description: "Image tag (e.g., develop, latest)"
        required: true
        type: string
      tag_latest:
        description: "Also tag images as latest"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
    outputs:
      manager_image:
        description: "Full Manager image reference"
        value: ${{ jobs.build.outputs.manager_image }}
      agent_image:
        description: "Full Agent image reference"
        value: ${{ jobs.build.outputs.agent_image }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/onflux-tech

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: dockeeper-manager
            dockerfile: Dockerfile.manager
            description: Dockeeper Manager — Web UI + gRPC Server
            output_key: manager_image
          - name: dockeeper-agent
            dockerfile: Dockerfile.agent
            description: Dockeeper Agent — Docker/K8s Monitor
            output_key: agent_image
    outputs:
      manager_image: ${{ steps.meta.outputs.tags }}
      agent_image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.tag_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/onflux-tech/dockeeper
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: ${{ inputs.platforms }}
          provenance: false
          sbom: false
